<div id="cognitive-bias-root" class="not-prose"></div>

<style>
/* 1. RESTORED PREMIUM CSS FRAMEWORK (.cb-) */
:root {
  --cb-primary: rgba(var(--color-primary-500, 59, 130, 246), 1);
  --cb-primary-hover: rgba(var(--color-primary-600, 37, 99, 235), 1);
  --cb-secondary: rgba(var(--color-secondary-500, 168, 85, 247), 1);
  --cb-bg-light: #ffffff;
  --cb-bg-dark: #121212;
  --cb-text-light: #1f2937;
  --cb-text-dark: #f9fafb;
}

.cb-root {
  font-family: inherit;
  width: 100%;
  max-width: 1024px;
  margin: 3rem auto;
  box-sizing: border-box;
  color: var(--cb-text-light);
}
.dark .cb-root { color: var(--cb-text-dark); }

.cb-header { text-align: center; margin-bottom: 3rem; }
.cb-title {
  display: block;
  width: fit-content;
  margin: 0 auto 1rem auto;
  font-size: clamp(2.5rem, 6vw, 4.5rem);
  font-weight: 900;
  line-height: 1.1;
  background: linear-gradient(135deg, var(--cb-primary), var(--cb-secondary));
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  color: transparent;
  padding-bottom: 0.2em;
}
.cb-subtitle {
  font-size: clamp(1rem, 2vw, 1.25rem);
  color: #4b5563;
  max-width: 600px;
  margin: 0 auto;
  line-height: 1.6;
}
.dark .cb-subtitle { color: #9ca3af; }

/* The Glassmorphism Panel */
.cb-panel {
  background: rgba(255, 255, 255, 0.7);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-radius: 24px;
  padding: 2.5rem;
  box-shadow: 0 25px 50px -12px rgba(0,0,0,0.1);
  border: 1px solid rgba(255,255,255,0.8);
  margin-bottom: 2rem;
}
.dark .cb-panel {
  background: rgba(30,30,30, 0.6);
  border: 1px solid rgba(255,255,255,0.08);
  box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
}

/* Textarea with High Contrast */
.cb-textarea {
  width: 100%;
  min-height: 250px;
  padding: 1.5rem;
  font-size: 1.125rem;
  line-height: 1.6;
  border-radius: 16px;
  background: #ffffff;
  border: 2px solid #e5e7eb;
  color: var(--cb-text-light);
  outline: none;
  transition: all 0.3s ease;
  box-sizing: border-box;
  resize: vertical;
}
.dark .cb-textarea {
  background: rgba(15,15,15, 0.8);
  border-color: #374151;
  color: var(--cb-text-dark);
}
.cb-textarea:focus {
  border-color: var(--cb-primary);
  box-shadow: 0 0 0 4px rgba(var(--color-primary-500), 0.15);
}

/* Control Buttons & Toggles */
.cb-controls {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 2rem;
  gap: 1.5rem;
  flex-wrap: wrap;
}

.cb-toggle-wrapper {
  display: flex;
  align-items: center;
  background: #f3f4f6;
  padding: 0.5rem 1rem;
  border-radius: 12px;
  border: 1px solid #e5e7eb;
}
.dark .cb-toggle-wrapper {
  background: rgba(40,40,40, 0.8);
  border-color: #374151;
}

.cb-toggle-label {
  font-weight: 700;
  font-size: 0.875rem;
  margin-right: 1rem;
  cursor: pointer;
  color: #4b5563;
}
.dark .cb-toggle-label { color: #d1d5db; }

.cb-toggle-btn {
  position: relative;
  width: 3.5rem;
  height: 2rem;
  border-radius: 99px;
  background: var(--cb-primary);
  border: none;
  cursor: pointer;
  transition: background 0.3s;
}
.cb-toggle-btn[data-active="false"] { background: #cbd5e1; }
.dark .cb-toggle-btn[data-active="false"] { background: #475569; }

.cb-toggle-knob {
  position: absolute;
  top: 0.25rem;
  left: 0.25rem;
  width: 1.5rem;
  height: 1.5rem;
  background: white;
  border-radius: 50%;
  transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
.cb-toggle-btn[data-active="true"] .cb-toggle-knob { transform: translateX(1.5rem); }

.cb-analyze-btn {
  background: var(--cb-text-light);
  color: white;
  border: none;
  padding: 1rem 2.5rem;
  font-size: 1.125rem;
  font-weight: 800;
  border-radius: 16px;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.75rem;
}
.dark .cb-analyze-btn {
  background: white;
  color: var(--cb-text-light);
}
.cb-analyze-btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* 2. INTERACTIVE HIGHLIGHTING & TOOLTIPS */
.cb-highlight-container {
  line-height: 1.8;
  font-size: 1.1rem;
  white-space: pre-wrap;
  color: var(--cb-text-light);
}
.dark .cb-highlight-container { color: var(--cb-text-dark); }

.cb-highlight-fragment {
  position: relative;
  cursor: help;
  border-radius: 4px;
  padding: 2px 0;
}

.cb-highlight-red {
    background-color: rgba(239, 68, 68, 0.15);
    border-bottom: 2px solid rgba(239, 68, 68, 0.6);
}
.cb-highlight-green {
    background-color: rgba(34, 197, 94, 0.15);
    border-bottom: 2px solid rgba(34, 197, 94, 0.6);
}

.cb-tooltip-content {
    visibility: hidden;
    opacity: 0;
    position: absolute;
    bottom: 125%;
    left: 50%;
    transform: translateX(-50%) translateY(10px);
    width: 250px;
    padding: 1rem;
    background: rgba(15, 23, 42, 0.98);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    color: white;
    border-radius: 12px;
    box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    z-index: 9999;
    transition: all 0.2s cubic-bezier(0.165, 0.84, 0.44, 1);
    font-size: 0.9rem;
    pointer-events: none;
    line-height: 1.4;
    border: 1px solid rgba(255, 255, 255, 0.1);
}

.cb-highlight-fragment:hover .cb-tooltip-content {
    visibility: visible;
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

.cb-tooltip-header {
    font-weight: 900;
    margin-bottom: 0.5rem;
    display: block;
    text-transform: uppercase;
    font-size: 0.7rem;
    letter-spacing: 0.1em;
}
.cb-tooltip-red .cb-tooltip-header { color: #f87171; }
.cb-tooltip-green .cb-tooltip-header { color: #4ade80; }

/* Extra Insights Fallback */
.cb-insights-fallback {
  margin-top: 2rem;
  border-top: 1px solid rgba(150,150,150,0.1);
  padding-top: 1.5rem;
}
.cb-insight-item {
  display: flex;
  gap: 0.5rem;
  font-size: 0.9rem;
  margin-bottom: 0.75rem;
  opacity: 0.8;
}

/* Animations */
@keyframes cbFadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.cb-animate-fade { animation: cbFadeIn 0.4s ease-out forwards; }
@keyframes cbSpin { to { transform: rotate(360deg); } }
.cb-spinner { animation: cbSpin 1s linear infinite; }

</style>

<script type="module">
    import { h, render } from 'https://esm.sh/preact';
    import { useState, useCallback, useMemo } from 'https://esm.sh/preact/hooks';
    import htm from 'https://esm.sh/htm';

    const html = htm.bind(h);

    const HighlightedText = ({ text, biases, strengths }) => {
        const segments = useMemo(() => {
            if (!text) return [];
            const normText = (text || "").replace(/\r\n/g, '\n');
            const items = [
                ...(biases || []).map(b => ({ ...b, type: 'bias', phrase: (b.phrase || "").replace(/\r\n/g, '\n') })),
                ...(strengths || []).map(s => ({ ...s, type: 'strength', phrase: (s.phrase || "").replace(/\r\n/g, '\n') }))
            ].filter(i => i.phrase && i.phrase.trim().length > 0);

            const matches = [];
            items.forEach(item => {
                let lastIdx = 0;
                while (true) {
                    const idx = normText.indexOf(item.phrase, lastIdx);
                    if (idx === -1) break;
                    matches.push({ start: idx, end: idx + item.phrase.length, ...item });
                    lastIdx = idx + 1;
                }
            });

            matches.sort((a, b) => a.start - b.start || (b.end - b.start) - (a.end - a.start));
            const unique = [];
            let currentEnd = -1;
            matches.forEach(m => {
                if (m.start >= currentEnd) {
                    unique.push(m);
                    currentEnd = m.end;
                }
            });

            const res = [];
            let cursor = 0;
            unique.forEach(m => {
                if (m.start > cursor) res.push({ type: 'text', content: normText.slice(cursor, m.start) });
                res.push({ type: m.type, content: m.phrase, detail: m });
                cursor = m.end;
            });
            if (cursor < normText.length) res.push({ type: 'text', content: normText.slice(cursor) });
            return res;
        }, [text, biases, strengths]);

        return html`
            <div class="cb-highlight-container">
                ${segments.map(seg => {
                    if (seg.type === 'text') return seg.content;
                    const isBias = seg.type === 'bias';
                    const detail = seg.detail;
                    return html`
                        <span class="cb-highlight-fragment ${isBias ? 'cb-highlight-red' : 'cb-highlight-green'}">
                            ${seg.content}
                            <span class="cb-tooltip-content ${isBias ? 'cb-tooltip-red' : 'cb-tooltip-green'}">
                                <span class="cb-tooltip-header">${isBias ? (detail.biasName || 'Bias') : 'Strength'}</span>
                                ${isBias ? detail.explanation : detail.endorsement}
                            </span>
                        </span>
                    `;
                })}
            </div>
        `;
    };

    const App = () => {
        const [inputText, setInputText] = useState("I know everything will fail because I'm always unlucky. This statement is objective.");
        const [analysisResult, setAnalysisResult] = useState(null);
        const [lastAnalyzedText, setLastAnalyzedText] = useState("");
        const [isLoading, setIsLoading] = useState(false);
        const [isThinkingMode, setIsThinkingMode] = useState(false);
        const [backendError, setBackendError] = useState(null);

        const handleAnalyze = async () => {
            if (!inputText.trim()) return;
            setIsLoading(true); setAnalysisResult(null); setBackendError(null);
            setLastAnalyzedText(inputText);

            try {
                const response = await fetch('/.netlify/functions/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        text: inputText, 
                        language: document.documentElement.lang || 'en', 
                        isThinkingMode 
                    })
                });

                const data = await response.json();
                if (!response.ok) throw new Error(JSON.stringify(data));
                setAnalysisResult(data);
            } catch (err) {
                console.error(err);
                try { setBackendError(JSON.parse(err.message)); }
                catch { setBackendError({ error: err.message }); }
            } finally { setIsLoading(false); }
        };

        return html`
            <div class="cb-root">
                <header class="cb-header">
                    <h1 class="cb-title">{{ i18n "cognitive_detector.title" }}</h1>
                    <p class="cb-subtitle">{{ i18n "cognitive_detector.subtitle" }}</p>
                </header>

                <div class="cb-panel">
                    <textarea 
                        class="cb-textarea"
                        value=${inputText}
                        onInput=${(e) => setInputText(e.target.value)}
                        placeholder='{{ i18n "cognitive_detector.placeholder" }}'
                        disabled=${isLoading}
                    ></textarea>

                    <div class="cb-controls">
                        <div class="cb-toggle-wrapper">
                            <label class="cb-toggle-label" onClick=${() => setIsThinkingMode(!isThinkingMode)}>
                                ${isThinkingMode ? "Deep Analysis (Gemini 2.5 Pro)" : "Fast Analysis (Gemini 2.5 Flash)"}
                            </label>
                            <button class="cb-toggle-btn" data-active=${isThinkingMode} onClick=${() => setIsThinkingMode(!isThinkingMode)}>
                                <span class="cb-toggle-knob"></span>
                            </button>
                        </div>

                        <button class="cb-analyze-btn" disabled=${isLoading} onClick=${handleAnalyze}>
                            ${isLoading ? html`<span class="cb-spinner inline-block mr-2 text-xl">⟳</span> ${'{{ i18n "cognitive_detector.analyzing" }}'}` : html`${'{{ i18n "cognitive_detector.analyze_btn" }}'}`}
                        </button>
                    </div>
                </div>

                ${(isLoading || analysisResult || backendError) && html`
                    <div class="cb-animate-fade">
                        ${isLoading ? html`
                            <div style="text-align:center; padding:3rem; opacity:0.6">
                                <div class="cb-spinner" style="width:3rem; height:3rem; border:4px solid rgba(var(--color-primary-500), 0.2); border-top-color:var(--cb-primary); border-radius:50%; margin:0 auto 1.5rem auto"></div>
                                <p style="font-weight:900; letter-spacing:0.1em; text-transform:uppercase">${'{{ i18n "cognitive_detector.analyzing" }}'}</p>
                            </div>
                        ` : analysisResult ? html`
                            <div class="cb-panel" style="padding:3rem">
                                <h3 style="font-size:2rem; font-weight:900; margin-bottom:2rem; font-style:italic">
                                    🔍 ${'{{ i18n "cognitive_detector.results_title" }}'}
                                </h3>

                                <${HighlightedText} 
                                    text=${lastAnalyzedText} 
                                    biases=${analysisResult.biases} 
                                    strengths=${analysisResult.strengths} 
                                />

                                ${(() => {
                                    const textLower = (lastAnalyzedText || "").toLowerCase();
                                    const unmatchedBiases = (analysisResult.biases || []).filter(b => b.phrase && !textLower.includes(b.phrase.toLowerCase()));
                                    const unmatchedStrengths = (analysisResult.strengths || []).filter(s => s.phrase && !textLower.includes(s.phrase.toLowerCase()));
                                    
                                    if (unmatchedBiases.length === 0 && unmatchedStrengths.length === 0) return null;
                                    return html`
                                        <div class="cb-insights-fallback">
                                            <h4 style="font-size:0.7rem; font-weight:900; text-transform:uppercase; color:gray; letter-spacing:0.1em; margin-bottom:1rem">Additional Contextual Insights</h4>
                                            ${unmatchedBiases.map(b => html`
                                                <div class="cb-insight-item" style="color:#ef4444">
                                                    <strong>[${b.biasName}]</strong> ${b.explanation}
                                                </div>
                                            `)}
                                            ${unmatchedStrengths.map(s => html`
                                                <div class="cb-insight-item" style="color:var(--cb-primary)">
                                                    <strong>[Strength]</strong> ${s.endorsement}
                                                </div>
                                            `)}
                                        </div>
                                    `;
                                })()}
                            </div>
                        ` : backendError ? html`
                            <div class="cb-panel" style="border-color:#ef4444; background:rgba(239, 68, 68, 0.05); text-align:center">
                                <h3 style="color:#ef4444; font-weight:900; font-size:1.5rem; margin-bottom:1rem">⚠️ Analysis Error</h3>
                                <pre style="font-size:0.75rem; opacity:0.7; overflow:auto; max-height:10rem; margin-bottom:1.5rem">${JSON.stringify(backendError, null, 2)}</pre>
                                <button onClick=${handleAnalyze} class="cb-analyze-btn" style="background:#ef4444; margin:0 auto">Retry</button>
                            </div>
                        ` : ''}
                    </div>
                `}
            </div>
        `;
    };

    render(html`<${App} />`, document.getElementById('cognitive-bias-root'));
</script>
