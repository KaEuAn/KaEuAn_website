<div id="cognitive-bias-root" class="not-prose"></div>

<style>
    /* Modern Interactive Highlights */
    .highlight-container {
        line-height: 1.8;
        font-size: 1.1rem;
        white-space: pre-wrap;
    }

    .highlight-fragment {
        position: relative;
        cursor: help;
        border-radius: 4px;
        padding: 2px 0;
        transition: all 0.2s ease;
    }

    .highlight-red {
        background-color: rgba(239, 68, 68, 0.1);
        border-bottom: 2px solid rgba(239, 68, 68, 0.5);
    }
    .highlight-red:hover {
        background-color: rgba(239, 68, 68, 0.2);
    }

    .highlight-green {
        background-color: rgba(34, 197, 94, 0.1);
        border-bottom: 2px solid rgba(34, 197, 94, 0.5);
    }
    .highlight-green:hover {
        background-color: rgba(34, 197, 94, 0.2);
    }

    /* Glassmorphism Tooltips */
    .tooltip-content {
        visibility: hidden;
        opacity: 0;
        position: absolute;
        bottom: 125%;
        left: 50%;
        transform: translateX(-50%) translateY(10px);
        width: 250px;
        padding: 1rem;
        background: rgba(var(--color-neutral-800, 31, 41, 55), 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        color: white;
        border-radius: 12px;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        z-index: 100;
        transition: all 0.3s cubic-bezier(0.165, 0.84, 0.44, 1);
        font-size: 0.85rem;
        font-weight: normal;
        pointer-events: none;
        border: 1px solid rgba(255, 255, 255, 0.1);
        line-height: 1.4;
    }

    .highlight-fragment:hover .tooltip-content {
        visibility: visible;
        opacity: 1;
        transform: translateX(-50%) translateY(0);
    }

    .tooltip-header {
        font-weight: 900;
        margin-bottom: 0.5rem;
        display: block;
        text-transform: uppercase;
        font-size: 0.7rem;
        letter-spacing: 0.1em;
    }

    .tooltip-red .tooltip-header { color: #f87171; }
    .tooltip-green .tooltip-header { color: #4ade80; }

    @media (max-width: 640px) {
        .tooltip-content {
            width: 220px;
            left: 0;
            transform: translateY(10px);
        }
        .highlight-fragment:hover .tooltip-content {
            transform: translateY(0);
        }
    }

    /* Dictionary Styles */
    .custom-scrollbar::-webkit-scrollbar { width: 4px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(var(--color-primary-500), 0.2); border-radius: 10px; }
</style>

<script type="module">
    import { h, render } from 'https://esm.sh/preact';
    import { useState, useCallback, useMemo } from 'https://esm.sh/preact/hooks';
    import htm from 'https://esm.sh/htm';

    const html = htm.bind(h);

    const logicDictionary = {
        DecisionMaking: [
            { name: "Confirmation Bias", desc: "Favoring information that confirms existing beliefs." },
            { name: "Anchoring Bias", desc: "Relying too heavily on the first piece of information encountered." },
            { name: "Sunk Cost Fallacy", desc: "Continuing an endeavor due to previously invested resources." }
        ],
        SocialBiases: [
            { name: "Halo Effect", desc: "Impression in one area influencing opinion in another." },
            { name: "In-group Bias", desc: "Favoring members of one's own group." }
        ],
        LogicErrors: [
            { name: "Correlation vs Causation", desc: "Assuming that because two things happen together, one caused the other." },
            { name: "Strawman Fallacy", desc: "Misrepresenting someone's argument to make it easier to attack." }
        ]
    };

    const HighlightedText = ({ text, biases, strengths }) => {
        const segments = useMemo(() => {
            if (!text) return [];
            const normText = text.replace(/\r\n/g, '\n');
            const items = [
                ...(biases || []).map(b => ({ ...b, type: 'bias', phrase: (b.phrase || "").replace(/\r\n/g, '\n') })),
                ...(strengths || []).map(s => ({ ...s, type: 'strength', phrase: (s.phrase || "").replace(/\r\n/g, '\n') }))
            ].filter(i => i.phrase && i.phrase.trim().length > 0);

            const matches = [];
            items.forEach(item => {
                let lastIdx = 0;
                while (true) {
                    const idx = normText.indexOf(item.phrase, lastIdx);
                    if (idx === -1) break;
                    matches.push({ start: idx, end: idx + item.phrase.length, ...item });
                    lastIdx = idx + 1;
                }
            });

            matches.sort((a, b) => a.start - b.start || (b.end - b.start) - (a.end - a.start));
            const unique = [];
            let currentEnd = -1;
            matches.forEach(m => {
                if (m.start >= currentEnd) {
                    unique.push(m);
                    currentEnd = m.end;
                }
            });

            const res = [];
            let cursor = 0;
            unique.forEach(m => {
                if (m.start > cursor) res.push({ type: 'text', content: normText.slice(cursor, m.start) });
                res.push({ type: m.type, content: m.phrase, detail: m });
                cursor = m.end;
            });
            if (cursor < normText.length) res.push({ type: 'text', content: normText.slice(cursor) });
            return res;
        }, [text, biases, strengths]);

        if (!text) return null;

        return html`
            <div class="highlight-container">
                ${segments.map(seg => {
                    if (seg.type === 'text') return seg.content;
                    const isBias = seg.type === 'bias';
                    const detail = seg.detail;
                    return html`
                        <span class="highlight-fragment ${isBias ? 'highlight-red' : 'highlight-green'}">
                            ${seg.content}
                            <span class="tooltip-content ${isBias ? 'tooltip-red' : 'tooltip-green'}">
                                <span class="tooltip-header">${isBias ? (detail.biasName || 'Bias') : 'Strength'}</span>
                                ${isBias ? detail.explanation : detail.endorsement}
                            </span>
                        </span>
                    `;
                })}
            </div>
        `;
    };

    const App = () => {
        const [inputText, setInputText] = useState("I am always right because I never make mistakes. This is a very objective statement.");
        const [analysisResult, setAnalysisResult] = useState(null);
        const [lastAnalyzedText, setLastAnalyzedText] = useState("");
        const [isLoading, setIsLoading] = useState(false);
        const [isThinkingMode, setIsThinkingMode] = useState(false);
        const [isGlossaryOpen, setIsGlossaryOpen] = useState(false);
        const [backendError, setBackendError] = useState(null);

        const handleAnalyze = async () => {
            if (!inputText.trim()) return;
            setIsLoading(true);
            setAnalysisResult(null);
            setBackendError(null);
            setLastAnalyzedText(inputText);

            try {
                const response = await fetch('/.netlify/functions/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: inputText, language: 'en', isThinkingMode })
                });

                if (!response.ok) {
                    const err = await response.json().catch(() => ({ error: "Server Error" }));
                    throw new Error(JSON.stringify(err));
                }

                setAnalysisResult(await response.json());
            } catch (err) {
                console.error(err);
                try {
                    setBackendError(JSON.parse(err.message));
                } catch {
                    setBackendError({ error: err.message });
                }
            } finally {
                setIsLoading(false);
            }
        };

        return html`
            <div class="space-y-8 max-w-5xl mx-auto px-4 py-12">
                <div class="text-center space-y-4">
                    <h2 class="text-4xl md:text-5xl font-black bg-clip-text text-transparent bg-gradient-to-r from-primary-500 to-secondary-500">
                        {{ i18n "cognitive_detector.title" }}
                    </h2>
                    <p class="text-neutral-500 italic">{{ i18n "cognitive_detector.subtitle" }}</p>
                </div>

                <div class="space-y-4">
                    <div class="relative group">
                        <textarea 
                            class="w-full h-80 p-8 rounded-3xl border-2 border-neutral-100 dark:border-neutral-800 bg-white dark:bg-neutral-900 focus:border-primary-500 transition-all outline-none resize-none shadow-xl text-lg"
                            value=${inputText}
                            onInput=${(e) => setInputText(e.target.value)}
                            placeholder="Enter text to analyze..."
                        ></textarea>
                        
                        <div class="absolute bottom-6 right-6 flex items-center space-x-4">
                            <button 
                                onClick=${() => setIsThinkingMode(!isThinkingMode)}
                                class="px-4 py-2 rounded-full border border-neutral-200 dark:border-neutral-700 hover:bg-neutral-50 dark:hover:bg-neutral-800 transition-all text-sm font-bold flex items-center space-x-2"
                            >
                                <span class="h-2 w-2 rounded-full ${isThinkingMode ? 'bg-secondary-500 animate-pulse' : 'bg-primary-500'}"></span>
                                <span>${isThinkingMode ? "Deep Analysis" : "Fast Analysis"}</span>
                            </button>
                            
                            <button 
                                onClick=${handleAnalyze}
                                disabled=${isLoading}
                                class="px-8 py-3 rounded-2xl bg-primary-500 text-white font-black shadow-lg hover:shadow-primary-500/20 hover:scale-105 active:scale-95 transition-all disabled:opacity-50"
                            >
                                ${isLoading ? html`<span class="animate-spin inline-block mr-2">⟳</span>` : ''}
                                {{ i18n "cognitive_detector.analyze_btn" }}
                            </button>
                        </div>
                    </div>
                </div>

                <div class="rounded-2xl bg-neutral-50 dark:bg-neutral-900/50 border border-neutral-200 dark:border-neutral-800 overflow-hidden">
                    <button onClick=${() => setIsGlossaryOpen(!isGlossaryOpen)} class="w-full p-4 flex justify-between items-center font-bold">
                        <span>📚 {{ i18n "cognitive_detector.dictionary_title" }}</span>
                        <span class="transform transition-transform ${isGlossaryOpen ? 'rotate-180' : ''}">▼</span>
                    </button>
                    ${isGlossaryOpen && html`
                        <div class="p-6 h-64 overflow-y-auto custom-scrollbar grid grid-cols-1 md:grid-cols-3 gap-6 border-t border-neutral-100 dark:border-neutral-800">
                            ${Object.entries(logicDictionary).map(([cat, items]) => html`
                                <div>
                                    <h4 class="text-xs font-black uppercase tracking-widest text-neutral-400 mb-3">${cat}</h4>
                                    ${items.map(i => html`
                                        <div class="mb-3">
                                            <div class="text-primary-500 font-bold text-sm">${i.name}</div>
                                            <div class="text-xs opacity-60">${i.desc}</div>
                                        </div>
                                    `)}
                                </div>
                            `)}
                        </div>
                    `}
                </div>

                ${(isLoading || analysisResult || backendError) && html`
                    <div id="results-area" class="animate-fade-in py-12 border-t-2 border-dashed border-neutral-100 dark:border-neutral-800">
                        ${isLoading ? html`
                            <div class="text-center py-20 space-y-4">
                                <div class="w-16 h-16 border-4 border-primary-500/20 border-t-primary-500 rounded-full animate-spin mx-auto"></div>
                                <p class="text-xl font-bold animate-pulse">{{ i18n "cognitive_detector.analyzing" }}</p>
                            </div>
                        ` : analysisResult ? html`
                            <div class="bg-white dark:bg-neutral-900 rounded-3xl border border-neutral-200 dark:border-neutral-800 shadow-2xl p-8 md:p-12 space-y-8">
                                <div class="flex items-center space-x-3">
                                    <span class="text-2xl">🔍</span>
                                    <h3 class="text-2xl font-black italic">{{ i18n "cognitive_detector.results_title" }}</h3>
                                </div>

                                <${HighlightedText} 
                                    text=${lastAnalyzedText} 
                                    biases=${analysisResult.biases} 
                                    strengths=${analysisResult.strengths} 
                                />

                                ${(() => {
                                    const textLower = (lastAnalyzedText || "").toLowerCase();
                                    const unmatchedBiases = (analysisResult.biases || []).filter(b => b.phrase && !textLower.includes(b.phrase.toLowerCase()));
                                    const unmatchedStrengths = (analysisResult.strengths || []).filter(s => s.phrase && !textLower.includes(s.phrase.toLowerCase()));
                                    if (unmatchedBiases.length === 0 && unmatchedStrengths.length === 0) return null;
                                    return html`
                                        <div class="mt-8 pt-8 border-t border-neutral-100 dark:border-neutral-800 space-y-4">
                                            <h4 class="text-xs font-black uppercase tracking-widest text-neutral-400">Contextual Insights</h4>
                                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                                ${unmatchedBiases.map(b => html`
                                                    <div class="p-4 bg-red-500/5 rounded-2xl border border-red-500/10 text-sm">
                                                        <strong class="text-red-500 uppercase text-xs block mb-1">${b.biasName}</strong>
                                                        ${b.explanation}
                                                    </div>
                                                `)}
                                                ${unmatchedStrengths.map(s => html`
                                                    <div class="p-4 bg-primary-500/5 rounded-2xl border border-primary-500/10 text-sm">
                                                        <strong class="text-primary-500 uppercase text-xs block mb-1">Strength</strong>
                                                        ${s.endorsement}
                                                    </div>
                                                `)}
                                            </div>
                                        </div>
                                    `;
                                })()}
                            </div>
                        ` : backendError ? html`
                            <div class="bg-red-50 dark:bg-red-900/10 border-2 border-red-500/20 rounded-3xl p-12 text-center space-y-6">
                                <div class="text-5xl">⚠️</div>
                                <h3 class="text-2xl font-bold text-red-600">{{ i18n "cognitive_detector.error_generic" }}</h3>
                                <pre class="p-4 bg-white dark:bg-black/20 rounded-xl text-left text-xs font-mono overflow-auto max-h-40">${JSON.stringify(backendError, null, 2)}</pre>
                                <button onClick=${handleAnalyze} class="px-12 py-4 bg-red-500 text-white rounded-2xl font-black shadow-lg">Retry Analysis</button>
                            </div>
                        ` : ''}
                    </div>
                `}
            </div>
        `;
    };

    render(html`<${App} />`, document.getElementById('cognitive-bias-root'));
</script>
