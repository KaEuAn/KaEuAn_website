@keyframes cbShake {

<script type="module">
import { h, Component, render } from 'https://esm.sh/preact@10.20.1';
import htm from 'https://esm.sh/htm@3.1.1';
import { useState, useCallback, useEffect, useMemo } from 'https://esm.sh/preact@10.20.1/hooks';

const html = htm.bind(h);

const translations = {
    en: {
        title: 'Cognitive Bias Detector',
        subtitle: 'Uncover hidden biases and identify strengths in your text using advanced AI.',
        textAreaPlaceholder: 'Enter a paragraph, article, or statement here to analyze its underlying biases...',
        thinkingMode: 'Deep Analysis',
        viewGlossary: 'Bias Glossary',
        analyzeText: 'Analyze Text',
        analyzing: 'Analyzing...',
        errorAnalysis: 'Failed to analyze the text. Please check your connection or try again later.',
        errorEmptyText: 'Please enter some text to analyze.',
        analysisResultTitle: 'Analysis Result',
        analysisCompleteNoFindings: 'Analysis complete. No specific biases or notable strengths were detected.',
        strengthTitle: 'Objective & Clear Statements',
        glossaryTitle: 'Cognitive Bias Glossary',
        searchPlaceholder: 'Search for a bias...',
        definition: 'Definition',
        example: 'Example',
        impact: 'Impact',
        noBiasesMatchingSearch: 'No biases found matching your search.',
        glossary: {
            "Decision-Making Biases": [
                { name: 'Confirmation Bias', definition: 'The tendency to search for, interpret, favor, and recall information that confirms or supports one\'s preexisting beliefs or hypotheses.', example: 'I knew this project would succeed because I only paid attention to the positive feedback.', impact: 'Leads to poor decision-making by reinforcing initial assumptions.' },
                { name: 'Anchoring Bias', definition: 'The tendency to rely too heavily on the first piece of information offered (the "anchor") when making decisions.', example: 'The first car salesman quoted $30,000. Every other offer now seems fantastic.', impact: 'Can lead to over- or undervaluing things based on an initial reference point.' },
                { name: 'Bandwagon Effect', definition: 'The tendency for individuals to adopt certain behaviors, styles, or attitudes simply because others are doing so.', example: 'Everyone is investing in this new cryptocurrency, so it must be a good idea.', impact: 'Can stifle innovation and independent thought, leading to groupthink.' },
                { name: 'Dunning-Kruger Effect', definition: 'The tendency for people with low ability at a task to overestimate their ability.', example: 'A beginner chess player believing they can easily beat a grandmaster.', impact: 'Prevents learning and leads to overconfidence in critical situations.' },
                { name: 'Availability Heuristic', definition: 'The tendency to rely on immediate examples that come to a given person\'s mind when evaluating a specific topic.', example: 'Believing airplane crashes are highly common because you recently saw one on the news.', impact: 'Distorts risk assessment and leads to irrational fears.' },
                { name: 'Sunk Cost Fallacy', definition: 'The tendency to continue investing in a losing proposition because of what it\'s already cost.', example: 'Staying in a terrible movie just because you paid for the ticket.', impact: 'Leads to wasted resources and poor strategic pivots.' }
            ],
            "Social Biases": [
                { name: 'Ingroup Bias', definition: 'The tendency to favor one\'s own group over out-groups.', example: 'Hiring someone solely because they went to the same university as you.', impact: 'Can lead to discrimination and a lack of diversity.' },
                { name: 'Fundamental Attribution Error', definition: 'The tendency for people to under-emphasize situational explanations for an individual\'s observed behavior while over-emphasizing dispositional and personality-based explanations.', example: 'Assuming someone who cut you off in traffic is a bad person, rather than realizing they might be rushing to the hospital.', impact: 'Causes unfair judgments and interpersonal conflict.' },
                { name: 'Halo Effect', definition: 'The tendency for positive impressions of a person, company, brand or product in one area to positively influence one\'s opinion or feelings in other areas.', example: 'Assuming a physically attractive person is also smart and competent.', impact: 'Clouded judgment in performance reviews or hiring.' }
            ],
            "Memory Errors": [
                { name: 'Hindsight Bias', definition: 'The tendency of people to overestimate their ability to have predicted an outcome that could not possibly have been predicted.', example: 'Saying "I knew it all along" after an unpredictable stock market crash.', impact: 'Creates an illusion of control and prevents learning from surprises.' },
                { name: 'Misinformation Effect', definition: 'The tendency for post-event information to interfere with the memory of the original event.', example: 'Remembering a yield sign as a stop sign after being asked "how fast were you going when you passed the stop sign?".', impact: 'Can lead to false eyewitness testimony.' }
            ]
        }
    },
    // ... skipping ru and pl for brevity of this code snippet, they would normally be loaded here
};

const getTranslations = (lang) => translations[lang] || translations.en;
const currentLang = document.documentElement.lang.substring(0, 2) || 'en';

const Glossary = ({ isOpen, onClose, t }) => {
    if (!isOpen) return null;
    const [searchTerm, setSearchTerm] = useState('');
    const [expandedBiases, setExpandedBiases] = useState({});
    
    const items = t.glossary || translations.en.glossary;
    
    const filteredCategories = {};
    Object.keys(items).forEach(category => {
        const filteredBiases = items[category].filter(i => i.name.toLowerCase().includes(searchTerm.toLowerCase()));
        if (filteredBiases.length > 0) {
            filteredCategories[category] = filteredBiases;
        }
    });

    const toggleExpand = (biasName) => {
        setExpandedBiases(prev => ({ ...prev, [biasName]: !prev[biasName] }));
    };

    return html`
        <div class="cb-modal-overlay">
            <div class="cb-modal">
                <div class="cb-modal-header">
                    <h2>${t.glossaryTitle}</h2>
                    <button class="cb-modal-close" onClick=${onClose}>✕</button>
                </div>
                <div class="cb-modal-search">
                    <input type="text" placeholder=${t.searchPlaceholder} onInput=${e => setSearchTerm(e.currentTarget.value)} value=${searchTerm} />
                </div>
                <div class="cb-modal-content">
                    ${Object.keys(filteredCategories).length > 0 ? Object.keys(filteredCategories).map(category => html`
                        <div key=${category} style="margin-bottom:1.5rem">
                            <h3 style="font-size:1.25rem; font-weight:800; margin-bottom:1rem; border-bottom:2px solid rgba(var(--color-primary-500, 59, 130, 246), 0.3); padding-bottom:0.5rem; color:var(--cb-text-light)">
                                <span class="dark:text-white">${category}</span>
                            </h3>
                            <div style="display:flex; flex-direction:column; gap:0.75rem">
                                ${filteredCategories[category].map(item => html`
                                    <div key=${item.name} class="cb-glossary-item" style="padding:0; overflow:hidden">
                                        <button 
                                            onClick=${() => toggleExpand(item.name)}
                                            style="width:100%; text-align:left; padding:1.25rem; border:none; background:transparent; display:flex; justify-content:space-between; align-items:center; cursor:pointer; outline:none"
                                        >
                                            <span style="font-weight:800; font-size:1.125rem; color:var(--cb-primary)">${item.name}</span>
                                            <span style="transition: transform 0.2s; color:var(--cb-primary); transform: ${expandedBiases[item.name] ? 'rotate(180deg)' : 'rotate(0)'}">▼</span>
                                        </button>
                                        
                                        ${expandedBiases[item.name] && html`
                                            <div style="padding:0 1.25rem 1.25rem 1.25rem; border-top:1px solid rgba(150,150,150,0.15); margin-top:0.5rem; background:rgba(150,150,150,0.03)">
                                                <div style="margin-bottom:1rem; margin-top:1rem"><strong>${t.definition}:</strong> <p style="margin:0.25rem 0">${item.definition}</p></div>
                                                ${item.example && html`<div style="margin-bottom:1rem"><strong>${t.example}:</strong> <p style="margin:0.25rem 0; font-style:italic; opacity:0.8">"${item.example}"</p></div>`}
                                                ${item.impact && html`<div><strong>${t.impact || "Impact"}:</strong> <p style="margin:0.25rem 0">${item.impact}</p></div>`}
                                            </div>
                                        `}
                                    </div>
                                `)}
                            </div>
                        </div>
                    `) : html`<p style="text-align:center; opacity:0.5; font-size:1.25rem; margin-top:2rem">${t.noBiasesMatchingSearch}</p>`}
                </div>
            </div>
        </div>
    `;
};

const App = () => {
    const textDefaultEn = 'Confirmation bias is evident when people favor information that confirms their existing beliefs. However, this report presents the data objectively. For example, after buying a new phone, a person might only read positive reviews to justify their purchase, which is a clear case of anchoring on their initial decision.';
    
    const [inputText, setInputText] = useState(textDefaultEn);
    const [analysisResult, setAnalysisResult] = useState(null);
    const [isLoading, setIsLoading] = useState(false);
    const [isThinkingMode, setIsThinkingMode] = useState(true);
    const [isGlossaryOpen, setIsGlossaryOpen] = useState(false);
    const [errorKey, setErrorKey] = useState(null);
    const [backendError, setBackendError] = useState(null);

    const t = useMemo(() => getTranslations(currentLang), [currentLang]);

    const handleAnalyzeClick = useCallback(async () => {
        if (!inputText.trim()) { setErrorKey("errorEmptyText"); return; }
        setIsLoading(true); setErrorKey(null); setBackendError(null); setAnalysisResult(null);

        try {
            const response = await fetch("/.netlify/functions/analyze", {
                method: "POST", headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ text: inputText, language: currentLang, isThinkingMode })
            });

            if (!response.ok) {
                const errData = await response.json().catch(() => ({}));
                throw new Error(errData.error || `HTTP error ${response.status}`);
            }

            setAnalysisResult(await response.json());
        } catch (err) {
            setErrorKey("errorAnalysis");
            setBackendError(err.message);
        } finally { setIsLoading(false); }
    }, [inputText, isThinkingMode, currentLang]);

    return html`
        <div class="cb-root">
            <header class="cb-header">
                <h1 class="cb-title">${t.title}</h1>
                <p class="cb-subtitle">${t.subtitle}</p>
            </header>

            <main>
                <div class="cb-panel">
                    <div class="cb-textarea-wrapper">
                        <textarea
                            value=${inputText}
                            onInput=${e => setInputText(e.currentTarget.value)}
                            placeholder=${t.textAreaPlaceholder}
                            class="cb-textarea"
                            disabled=${isLoading}
                        ></textarea>
                    </div>

                    <div class="cb-controls">
                        <div class="cb-actions-left">
                            <div class="cb-toggle-wrapper">
                                <label class="cb-toggle-label" onClick=${() => setIsThinkingMode(!isThinkingMode)}>
                                    ${t.thinkingMode}
                                </label>
                                <button class="cb-toggle-btn" data-active=${isThinkingMode} onClick=${() => setIsThinkingMode(!isThinkingMode)}>
                                    <span class="cb-toggle-knob"></span>
                                </button>
                            </div>
                            <button class="cb-link-btn" onClick=${() => setIsGlossaryOpen(true)}>
                                ${t.viewGlossary} →
                            </button>
                        </div>
                        
                        <button class="cb-analyze-btn" disabled=${isLoading} onClick=${handleAnalyzeClick}>
                            ${isLoading ? html`<svg class="cb-spinner" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="2" x2="12" y2="6"></line><line x1="12" y1="18" x2="12" y2="22"></line><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line><line x1="2" y1="12" x2="6" y2="12"></line><line x1="18" y1="12" x2="22" y2="12"></line><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"></line></svg> ${t.analyzing}` : html`<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg> ${t.analyzeText}`}
                        </button>
                    </div>
                </div>

                ${errorKey && html`
                    <div class="cb-error">
                        <div style="display:flex; align-items:center; gap:0.5rem">
                            <span style="font-size:1.25rem">⚠</span> 
                            <span>${t[errorKey]}</span>
                        </div>
                        ${backendError && html`
                            <div style="margin-top:0.5rem; padding-top:0.75rem; border-top:1px solid rgba(185,28,28,0.1); font-family:monospace; font-size:0.875rem; opacity:0.9">
                                <div style="font-weight:700; margin-bottom:0.25rem; font-size:0.75rem; text-transform:uppercase; opacity:0.6">Debug Information:</div>
                                <div style="word-break:break-all; line-height:1.4">
                                    ${backendError.includes('401') ? 'API Authentication Failed (401 Unauthorized)' : backendError}
                                </div>
                            </div>
                        `}
                    </div>
                `}

                ${analysisResult && html`
                    <div class="cb-results">
                        <div class="cb-panel">
                            <h2 class="cb-results-header">${t.analysisResultTitle}</h2>
                            
                            ${analysisResult.biases && analysisResult.biases.length > 0 && html`
                                <div>
                                    <h3 style="color:#ef4444; font-size:1.5rem; display:flex; align-items:center; gap:0.5rem; margin-bottom:1.5rem">
                                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
                                        Biases Detected
                                    </h3>
                                    <div class="cb-grid">
                                        ${analysisResult.biases.map(bias => html`
                                            <div class="cb-card bias">
                                                <h4 class="cb-card-title">${bias.biasName}</h4>
                                                <div class="cb-quote">"${bias.phrase}"</div>
                                                <div class="cb-explanation">${bias.explanation}</div>
                                            </div>
                                        `)}
                                    </div>
                                </div>
                            `}
                            
                            ${analysisResult.strengths && analysisResult.strengths.length > 0 && html`
                                <div style="margin-top:3rem">
                                    <h3 style="color:#22c55e; font-size:1.5rem; display:flex; align-items:center; gap:0.5rem; margin-bottom:1.5rem">
                                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                                        ${t.strengthTitle}
                                    </h3>
                                    <div class="cb-grid">
                                        ${analysisResult.strengths.map(str => html`
                                            <div class="cb-card strength">
                                                <div class="cb-quote">"${str.phrase}"</div>
                                                <div class="cb-explanation">✓ ${str.endorsement}</div>
                                            </div>
                                        `)}
                                    </div>
                                </div>
                            `}
                            
                            ${(!analysisResult.biases?.length && !analysisResult.strengths?.length) && html`
                                <p style="text-align:center; padding:3rem; opacity:0.6; font-size:1.25rem">${t.analysisCompleteNoFindings}</p>
                            `}
                        </div>
                    </div>
                `}
            </main>
        </div>
        <${Glossary} isOpen=${isGlossaryOpen} onClose=${() => setIsGlossaryOpen(false)} t=${t} />
    `;
};

render(html`<${App} />`, document.getElementById('cognitive-bias-root'));
</script>
